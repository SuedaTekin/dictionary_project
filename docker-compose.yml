services:
  db:
    image: mysql:5.7
    container_name: sozluk_db
    restart: always
    command: --max_allowed_packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sozluk
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sozluk_network

  php:
    build: .
    container_name: sozluk_php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - sozluk_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sozluk_pma
    restart: always
    ports:
      - "9090:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - sozluk_network

volumes:
  db_data:


networks:
  sozluk_network:
    driver: bridge
